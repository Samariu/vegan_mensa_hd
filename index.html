<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f3d2e" />
  <title>Vegan in der Mensa?</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f3ee;
      --surface: #ffffff;
      --ink: #1c1f1d;
      --muted: #6b716c;
      --line: rgba(28, 31, 29, .08);
      --brand: #0f3d2e;
      --brand-ink: #e9f5ee;

      --vegan: #1a7f64;      --vegan-bg: #e0f2ec;
      --not: #d9532b;        --not-bg: #fbe6de;
      --unclear: #b8860b;    --unclear-bg: #fbf1d6;
      --closed: #8b908c;     --closed-bg: #ecebe7;

      --radius: 18px;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111412;
        --surface: #1a1e1b;
        --ink: #eceeea;
        --muted: #9aa19b;
        --line: rgba(255,255,255,.08);
        --brand: #0b2c21;
        --brand-ink: #d6efe0;
        --vegan: #2a9d80;      --vegan-bg: rgba(42,157,128,.16);
        --not: #e8663c;        --not-bg: rgba(232,102,60,.15);
        --unclear: #cfa634;    --unclear-bg: rgba(207,166,52,.15);
        --closed: #8b908c;     --closed-bg: rgba(255,255,255,.05);
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

    /* ── header ── */
    header {
      background: var(--brand);
      color: var(--brand-ink);
      padding: 28px 0 88px;
    }
    .eyebrow {
      font-size: .75rem; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; opacity: .7;
    }
    header h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 800; font-size: clamp(1.8rem, 6vw, 2.4rem);
      line-height: 1.1; margin-top: 6px;
    }

    /* ── hero (today / next day) ── */
    .hero {
      margin-top: -64px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 6px;
      background: var(--accent, var(--closed));
    }
    .hero-label { font-size: .8rem; font-weight: 600; color: var(--muted); }
    .hero-answer {
      display: flex; align-items: center; gap: 14px;
      margin: 10px 0 14px;
    }
    .hero-answer .big {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2rem, 9vw, 2.8rem); font-weight: 800; line-height: 1;
      color: var(--accent); white-space: nowrap;
    }
    .hero-icon {
      width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center;
      background: var(--accent-bg); color: var(--accent);
    }
    .hero-icon svg { width: 28px; height: 28px; }
    .hero .dish-name { font-size: 1.05rem; font-weight: 500; line-height: 1.45; }
    .hero .dish-side { font-size: .92rem; color: var(--muted); margin-top: 2px; }

    /* ── reasons + chips ── */
    .reason {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 12px; padding: 6px 12px; border-radius: 999px;
      background: var(--not-bg); color: var(--not);
      font-size: .82rem; font-weight: 600;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip {
      font-size: .72rem; padding: 3px 9px; border-radius: 999px;
      background: var(--closed-bg); color: var(--muted);
      white-space: nowrap;
    }
    .chip.bad { background: var(--not-bg); color: var(--not); font-weight: 600; }
    .meta { display: flex; gap: 12px; margin-top: 14px; font-size: .82rem; color: var(--muted); }

    /* ── weeks ── */
    .week { margin-top: 32px; }
    .week h2 {
      font-size: .78rem; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
      display: flex; justify-content: space-between; align-items: baseline;
      margin: 0 4px 10px;
    }
    .week h2 .count { letter-spacing: 0; text-transform: none; font-weight: 500; }
    .card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }

    .day {
      display: grid; grid-template-columns: 52px 1fr; gap: 14px;
      padding: 14px 16px; border-top: 1px solid var(--line);
      cursor: pointer;
    }
    .day:first-child { border-top: none; }
    .day.past { opacity: .45; }
    .day.today { background: color-mix(in srgb, var(--accent-bg) 55%, transparent); }

    .date {
      width: 52px; border-radius: 12px; padding: 6px 0; text-align: center;
      background: var(--accent-bg); color: var(--accent);
      align-self: start;
    }
    .date .wd { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .date .dn { font-family: "Fraunces", Georgia, serif; font-size: 1.35rem; font-weight: 800; line-height: 1.1; }

    .day-body { min-width: 0; }
    .day-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .day .dish-name { font-size: .95rem; font-weight: 500; line-height: 1.4; }
    .day .dish-side { font-size: .85rem; color: var(--muted); margin-top: 1px; }
    .status {
      flex-shrink: 0; font-size: .72rem; font-weight: 600;
      color: var(--accent); white-space: nowrap;
    }
    .day .details { display: none; }
    .day.open .details { display: block; }
    .day .reason { margin-top: 8px; font-size: .76rem; padding: 4px 10px; }
    .closed-text { color: var(--muted); font-style: italic; font-size: .92rem; }

    /* status → accent colours */
    .s-vegan     { --accent: var(--vegan);   --accent-bg: var(--vegan-bg); }
    .s-not_vegan { --accent: var(--not);     --accent-bg: var(--not-bg); }
    .s-unclear   { --accent: var(--unclear); --accent-bg: var(--unclear-bg); }
    .s-closed    { --accent: var(--closed);  --accent-bg: var(--closed-bg); }

    .legend {
      display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center;
      margin: 32px 0 12px; font-size: .8rem; color: var(--muted);
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

    footer { text-align: center; font-size: .75rem; color: var(--muted); padding: 8px 16px 40px; line-height: 1.6; }
    footer a { color: inherit; }

    /* ── tabs ── */
    .tabs {
      display: inline-flex; gap: 4px; margin-top: 18px; padding: 4px;
      background: rgba(255,255,255,.1); border-radius: 999px;
    }
    .tabs button {
      font: inherit; font-size: .85rem; font-weight: 600;
      border: 0; border-radius: 999px; padding: 7px 16px; cursor: pointer;
      background: transparent; color: var(--brand-ink); opacity: .75;
    }
    .tabs button[aria-selected="true"] { background: var(--brand-ink); color: var(--brand); opacity: 1; }
    [hidden] { display: none !important; }

    /* ── stats ── */
    .stats-hero { --accent: var(--vegan); --accent-bg: var(--vegan-bg); }
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
    .stat { border-radius: 12px; padding: 10px 12px; background: var(--accent-bg); }
    .stat .n { font-family: "Fraunces", Georgia, serif; font-size: 1.5rem; font-weight: 800; color: var(--ink); }
    .stat .l { font-size: .75rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .stat .l i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .sharebar { display: flex; gap: 2px; height: 10px; margin-top: 16px; }
    .sharebar span { background: var(--accent); }
    .sharebar span:first-child { border-radius: 4px 0 0 4px; }
    .sharebar span:last-child { border-radius: 0 4px 4px 0; }

    .chart-card { padding: 14px 16px; }
    .week-grid { display: grid; grid-template-columns: auto repeat(5, 1fr) auto; gap: 4px 4px; align-items: center; }
    .week-grid .hd { font-size: .7rem; color: var(--muted); text-align: center; font-weight: 600; }
    .week-grid .wk { font-size: .75rem; color: var(--muted); padding-right: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .week-grid .sum { font-size: .75rem; color: var(--muted); padding-left: 6px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cell {
      height: 26px; border-radius: 6px; background: var(--accent);
      display: grid; place-items: center; color: #fff; cursor: default;
    }
    .cell svg { width: 14px; height: 14px; }
    .cell.s-closed { background: var(--closed-bg); color: var(--muted); }
    .cell.empty { background: transparent; border: 1px dashed var(--line); }
    .cell:hover { outline: 2px solid var(--ink); outline-offset: 1px; }

    .wd-row { display: grid; grid-template-columns: 28px 1fr 44px; gap: 10px; align-items: center; padding: 6px 0; }
    .wd-row .wd { font-size: .8rem; font-weight: 600; color: var(--muted); }
    .wd-row .bar { display: flex; gap: 2px; height: 18px; }
    .wd-row .bar span { background: var(--accent); }
    .wd-row .bar span:first-child { border-radius: 4px 0 0 4px; }
    .wd-row .bar span:last-child { border-radius: 0 4px 4px 0; }
    .wd-row .pct { font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; }

    .tooltip {
      position: fixed; z-index: 10; max-width: 260px; pointer-events: none;
      background: var(--ink); color: var(--bg); border-radius: 10px;
      padding: 8px 10px; font-size: .78rem; line-height: 1.4;
      box-shadow: var(--shadow);
    }
    .tooltip b { display: block; margin-bottom: 2px; }

    #error-msg {
      display: none; margin-top: 16px; padding: 14px 16px; border-radius: 12px;
      background: var(--not-bg); color: var(--not);
    }
    .skeleton { height: 180px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="eyebrow">Mensa Im Neuenheimer Feld 304 · Ausgabe D</div>
      <h1>Gibt's heute was Veganes?</h1>
      <nav class="tabs" role="tablist">
        <button role="tab" data-view="plan" aria-selected="true">Speiseplan</button>
        <button role="tab" data-view="stats" aria-selected="false">Statistik</button>
      </nav>
    </div>
  </header>

  <main class="wrap" id="view-plan">
    <section class="hero skeleton" id="hero"></section>
    <div id="error-msg"></div>
    <div id="weeks"></div>

    <div class="legend">
      <span class="s-vegan"><i></i>vegan</span>
      <span class="s-not_vegan"><i></i>nicht vegan</span>
      <span class="s-unclear"><i></i>unklar</span>
      <span class="s-closed"><i></i>geschlossen</span>
    </div>
  </main>

  <main class="wrap" id="view-stats" hidden>
    <section class="hero stats-hero" id="stats-hero"></section>
    <section class="week">
      <h2><span>Woche für Woche</span><span class="count" id="weeks-range"></span></h2>
      <div class="card chart-card"><div id="week-grid" class="week-grid"></div></div>
    </section>
    <section class="week">
      <h2><span>Nach Wochentag</span></h2>
      <div class="card chart-card"><div id="weekday-bars"></div></div>
    </section>
    <div class="legend">
      <span class="s-vegan"><i></i>vegan</span>
      <span class="s-not_vegan"><i></i>nicht vegan</span>
      <span class="s-unclear"><i></i>unklar</span>
      <span class="s-closed"><i></i>geschlossen / keine Daten</span>
    </div>
    <div id="tooltip" class="tooltip" hidden></div>
  </main>

  <footer id="footer"></footer>

  <script>
    const WD_SHORT = { Montag: "Mo", Dienstag: "Di", Mittwoch: "Mi", Donnerstag: "Do", Freitag: "Fr" };
    const STATUS_TEXT = { vegan: "vegan", not_vegan: "nicht vegan", unclear: "unklar", closed: "geschlossen" };
    const HERO_TEXT   = { vegan: "Ja, vegan!", not_vegan: "Leider nicht", unclear: "Unklar", closed: "Geschlossen" };
    const NON_VEGAN_CODES = new Set(["ML", "Ei", "Fi", "Kr", "We", "13", "14", "15", "16"]);
    const ICONS = {
      vegan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
      not_vegan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
      unclear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9.2 9a3 3 0 1 1 4.2 2.8c-.9.4-1.4 1.1-1.4 2v.7"/><circle cx="12" cy="18" r=".6" fill="currentColor"/></svg>',
      closed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 12h10"/></svg>',
    };

    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    };

    function parseDate(s) {
      const [d, m, y] = s.split(".").map(Number);
      return new Date(y, m - 1, d);
    }

    function mondayOf(date) {
      const d = new Date(date);
      d.setDate(d.getDate() - (d.getDay() + 6) % 7);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    const fmt = (d, opts) => d.toLocaleDateString("de-DE", opts);

    /* Split "Gnocchi mit X (3,GlWe,ML)\nSalat (Sf)" into clean component names
       without the code lists. First line = main dish, rest = sides. */
    function components(text) {
      return text.split(/\n|<br\s*\/?>/i)
        .map(l => l.replace(/\s*\([^)]*\)\s*/g, " ").replace(/\s+/g, " ").trim())
        .filter(Boolean);
    }

    function dishBlock(dish, withDetails) {
      const frag = document.createDocumentFragment();
      const [main, ...sides] = components(dish.text);
      frag.appendChild(el("div", "dish-name", main || dish.text));
      for (const s of sides) frag.appendChild(el("div", "dish-side", "+ " + s));
      return frag;
    }

    function detailsBlock(dish) {
      const box = el("div", "details");
      if (dish.vegan_status === "not_vegan" && dish.reasons?.length) {
        box.appendChild(el("div", "reason", "Enthält " + dish.reasons.join(", ")));
      }
      const codes = dish.codes || [];
      if (codes.length) {
        const chips = el("div", "chips");
        for (const c of codes) {
          chips.appendChild(el("span", "chip" + (NON_VEGAN_CODES.has(c.code) ? " bad" : ""), c.label));
        }
        box.appendChild(chips);
      }
      if (dish.price_studi) {
        const meta = el("div", "meta");
        meta.appendChild(el("span", null, dish.price_studi.replace(".", ",") + " € für Studis"));
        box.appendChild(meta);
      }
      return box;
    }

    function renderHero(day, today) {
      const hero = document.getElementById("hero");
      hero.classList.remove("skeleton");
      hero.innerHTML = "";
      if (!day) {
        hero.className = "hero s-closed";
        hero.appendChild(el("div", "hero-label", "Keine Daten"));
        hero.appendChild(el("div", "dish-name", "Für die kommenden Tage ist noch kein Speiseplan veröffentlicht."));
        return;
      }
      hero.className = "hero s-" + day.vegan_status;
      const isToday = +day.dateObj === +today;
      const label = isToday
        ? "Heute, " + fmt(day.dateObj, { weekday: "long", day: "numeric", month: "long" })
        : "Nächster Mensatag: " + fmt(day.dateObj, { weekday: "long", day: "numeric", month: "long" });
      hero.appendChild(el("div", "hero-label", label));

      const ans = el("div", "hero-answer");
      const icon = el("div", "hero-icon");
      icon.innerHTML = ICONS[day.vegan_status] || ICONS.unclear;
      ans.appendChild(icon);
      ans.appendChild(el("div", "big", HERO_TEXT[day.vegan_status] || "Unklar"));
      hero.appendChild(ans);

      if (day.closed) {
        hero.appendChild(el("div", "closed-text", "Die Mensa hat an diesem Tag geschlossen."));
        return;
      }
      for (const dish of day.dishes) {
        hero.appendChild(dishBlock(dish));
        const d = detailsBlock(dish);
        d.style.display = "block";
        hero.appendChild(d);
      }
      if (day.vegan_status === "unclear") {
        hero.appendChild(el("div", "dish-side",
          "Kein Vegan-Label, aber auch keine tierischen Allergene angegeben – im Zweifel an der Theke nachfragen."));
      }
    }

    function render(data) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const thisMonday = mondayOf(today);
      const days = data.days
        .map(d => ({ ...d, dateObj: parseDate(d.date) }))
        .filter(d => d.dateObj >= thisMonday)
        .sort((a, b) => a.dateObj - b.dateObj);

      renderHero(days.find(d => d.dateObj >= today), today);

      const weeks = new Map();
      for (const d of days) {
        const k = +mondayOf(d.dateObj);
        if (!weeks.has(k)) weeks.set(k, []);
        weeks.get(k).push(d);
      }

      const container = document.getElementById("weeks");
      for (const [k, list] of weeks) {
        const monday = new Date(k);
        const friday = new Date(k); friday.setDate(friday.getDate() + 4);
        const isThis = k === +thisMonday;
        const veganCount = list.filter(d => d.vegan_status === "vegan").length;
        const open = list.filter(d => !d.closed).length;

        const sec = el("section", "week");
        const h = el("h2");
        h.appendChild(el("span", null,
          (isThis ? "Diese Woche" : k === +thisMonday + 7 * 864e5 ? "Nächste Woche" : "Woche") +
          " · " + fmt(monday, { day: "numeric", month: "numeric" }) + "–" + fmt(friday, { day: "numeric", month: "numeric" })));
        if (open) h.appendChild(el("span", "count", `${veganCount} von ${open} Tagen vegan`));
        sec.appendChild(h);

        const card = el("div", "card");
        for (const day of list) {
          const isToday = +day.dateObj === +today;
          const row = el("div", `day s-${day.vegan_status}` + (isToday ? " today" : "") + (day.dateObj < today ? " past" : ""));

          const date = el("div", "date");
          date.appendChild(el("div", "wd", isToday ? "Heute" : (WD_SHORT[day.weekday] || day.weekday)));
          date.appendChild(el("div", "dn", String(day.dateObj.getDate())));
          row.appendChild(date);

          const body = el("div", "day-body");
          if (day.closed) {
            const top = el("div", "day-top");
            top.appendChild(el("div", "closed-text", "Geschlossen"));
            body.appendChild(top);
          } else {
            day.dishes.forEach((dish, i) => {
              const top = el("div", "day-top");
              const names = el("div");
              names.appendChild(dishBlock(dish));
              top.appendChild(names);
              if (i === 0) top.appendChild(el("span", "status", STATUS_TEXT[day.vegan_status]));
              body.appendChild(top);
              body.appendChild(detailsBlock(dish));
            });
            row.addEventListener("click", () => row.classList.toggle("open"));
            row.title = "Antippen für Details";
          }
          row.appendChild(body);
          card.appendChild(row);
        }
        sec.appendChild(card);
        container.appendChild(sec);
      }

      const foot = document.getElementById("footer");
      foot.appendChild(el("div", null,
        "Klassifiziert anhand der Allergen- und Zusatzstoff-Kennzeichnung des Studierendenwerks. Ohne Gewähr."));
      if (data.last_updated) {
        foot.appendChild(el("div", null, "Zuletzt aktualisiert: " +
          new Date(data.last_updated).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" })));
      }
    }

    /* ───────────── Statistik ───────────── */
    const ORDER = ["vegan", "not_vegan", "unclear"];
    const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

    function segBar(cls, counts, total) {
      const bar = el("div", cls);
      for (const s of ORDER) {
        if (!counts[s]) continue;
        const seg = el("span", "s-" + s);
        seg.style.flex = String(counts[s]);
        seg.title = `${STATUS_TEXT[s]}: ${counts[s]} (${pct(counts[s], total)} %)`;
        bar.appendChild(seg);
      }
      return bar;
    }

    function showTip(e, html) {
      const t = document.getElementById("tooltip");
      t.innerHTML = html; t.hidden = false;
      const r = t.getBoundingClientRect();
      let x = e.clientX + 12, y = e.clientY + 12;
      if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12;
      if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
      t.style.left = Math.max(8, x) + "px"; t.style.top = Math.max(8, y) + "px";
    }
    const hideTip = () => { document.getElementById("tooltip").hidden = true; };
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function renderStats(hist) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const days = hist.days
        .map(d => ({ ...d, dateObj: parseDate(d.date) }))
        .filter(d => d.dateObj <= today)
        .sort((a, b) => a.dateObj - b.dateObj);
      const open = days.filter(d => !d.closed);
      const counts = { vegan: 0, not_vegan: 0, unclear: 0 };
      for (const d of open) counts[d.vegan_status] = (counts[d.vegan_status] || 0) + 1;

      /* headline */
      const hero = document.getElementById("stats-hero");
      hero.innerHTML = "";
      if (!open.length) { hero.appendChild(el("div", "hero-label", "Noch keine Daten.")); return; }
      hero.appendChild(el("div", "hero-label",
        `Seit ${fmt(days[0].dateObj, { day: "numeric", month: "long", year: "numeric" })} · ${open.length} Öffnungstage`));
      const ans = el("div", "hero-answer");
      ans.appendChild(el("div", "big", pct(counts.vegan, open.length) + " %"));
      ans.appendChild(el("div", "dish-name", "der Tage gab es an Ausgabe D ein veganes Gericht"));
      hero.appendChild(ans);
      hero.appendChild(segBar("sharebar", counts, open.length));
      const row = el("div", "stat-row");
      for (const s of ORDER) {
        const st = el("div", "stat s-" + s);
        st.appendChild(el("div", "n", String(counts[s])));
        const l = el("div", "l"); l.appendChild(el("i")); l.appendChild(document.createTextNode(STATUS_TEXT[s]));
        st.appendChild(l);
        row.appendChild(st);
      }
      hero.appendChild(row);

      /* week grid, newest first */
      const byWeek = new Map();
      for (const d of days) {
        const k = +mondayOf(d.dateObj);
        if (!byWeek.has(k)) byWeek.set(k, new Array(5).fill(null));
        const i = (d.dateObj.getDay() + 6) % 7;
        if (i < 5) byWeek.get(k)[i] = d;
      }
      const grid = document.getElementById("week-grid");
      grid.innerHTML = "";
      grid.appendChild(el("div"));
      for (const w of ["Mo", "Di", "Mi", "Do", "Fr"]) grid.appendChild(el("div", "hd", w));
      grid.appendChild(el("div", "hd", "vegan"));
      const keys = [...byWeek.keys()].sort((a, b) => b - a);
      for (const k of keys) {
        const monday = new Date(k);
        grid.appendChild(el("div", "wk", fmt(monday, { day: "2-digit", month: "2-digit" })));
        let v = 0, o = 0;
        byWeek.get(k).forEach((d, i) => {
          const dateObj = new Date(k); dateObj.setDate(dateObj.getDate() + i);
          if (!d || dateObj > today) {
            const c = el("div", "cell empty");
            grid.appendChild(c);
            return;
          }
          const c = el("div", "cell s-" + d.vegan_status);
          c.innerHTML = ICONS[d.vegan_status] || "";
          if (!d.closed) { o++; if (d.vegan_status === "vegan") v++; }
          const dish = d.dishes[0] ? components(d.dishes[0].text)[0] : "Geschlossen";
          const why = d.dishes[0]?.reasons?.length ? "<br>Enthält " + esc(d.dishes[0].reasons.join(", ")) : "";
          const html = `<b>${esc(d.weekday)}, ${esc(d.date)} · ${STATUS_TEXT[d.vegan_status]}</b>${esc(dish)}${why}`;
          c.setAttribute("aria-label", `${d.date}: ${STATUS_TEXT[d.vegan_status]}`);
          c.addEventListener("mousemove", e => showTip(e, html));
          c.addEventListener("mouseleave", hideTip);
          c.addEventListener("click", e => { e.stopPropagation(); showTip(e, html); });
          grid.appendChild(c);
        });
        grid.appendChild(el("div", "sum", o ? `${v}/${o}` : "–"));
      }
      document.getElementById("weeks-range").textContent = `${keys.length} Wochen`;

      /* by weekday */
      const wdBox = document.getElementById("weekday-bars");
      wdBox.innerHTML = "";
      ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag"].forEach(name => {
        const list = open.filter(d => d.weekday === name);
        const c = { vegan: 0, not_vegan: 0, unclear: 0 };
        for (const d of list) c[d.vegan_status]++;
        const r = el("div", "wd-row");
        r.appendChild(el("div", "wd", WD_SHORT[name]));
        r.appendChild(segBar("bar", c, list.length));
        r.appendChild(el("div", "pct", pct(c.vegan, list.length) + " %"));
        r.title = `${name}: ${c.vegan} vegan, ${c.not_vegan} nicht vegan, ${c.unclear} unklar`;
        wdBox.appendChild(r);
      });
    }
    document.addEventListener("click", hideTip);

    /* ───────────── Tabs ───────────── */
    let statsLoaded = false;
    function showView(view) {
      document.querySelectorAll(".tabs button").forEach(b =>
        b.setAttribute("aria-selected", String(b.dataset.view === view)));
      document.getElementById("view-plan").hidden = view !== "plan";
      document.getElementById("view-stats").hidden = view !== "stats";
      if (view === "stats" && !statsLoaded) {
        statsLoaded = true;
        fetch("history.json", { cache: "no-cache" })
          .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
          .then(renderStats)
          .catch(err => {
            document.getElementById("stats-hero").textContent = "Statistik konnte nicht geladen werden: " + err.message;
          });
      }
    }
    document.querySelectorAll(".tabs button").forEach(b =>
      b.addEventListener("click", () => { history.replaceState(null, "", b.dataset.view === "stats" ? "#statistik" : "#"); showView(b.dataset.view); }));
    showView(location.hash === "#statistik" ? "stats" : "plan");

    fetch("menu.json", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
      .then(render)
      .catch(err => {
        document.getElementById("hero").style.display = "none";
        const e = document.getElementById("error-msg");
        e.textContent = "Menüdaten konnten nicht geladen werden: " + err.message;
        e.style.display = "block";
      });
  </script>
</body>
</html>
