name: Update Mensa Menu

on:
  # Run Mon–Fri at 06:30 UTC; the scraper itself skips runs that are too early.
  schedule:
    - cron: '30 6 * * 1-5'
  # Allow manual trigger from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether a fetch is due
        id: check
        run: |
          if [ ! -f menu.json ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEXT=$(python3 - <<'EOF'
          import json, sys
          try:
              d = json.load(open("menu.json"))
              print(d.get("next_fetch_date") or "")
          except Exception:
              print("")
          EOF
          )
          TODAY=$(date -u +%Y-%m-%d)
          if [ -n "$NEXT" ] && [[ "$TODAY" < "$NEXT" ]]; then
            echo "Skipping: next fetch scheduled for $NEXT, today is $TODAY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fetching: next_fetch_date=$NEXT, today=$TODAY"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install requests

      - name: Run scraper
        if: steps.check.outputs.skip != 'true'
        env:
          # Set this variable in Settings → Variables → Actions → New repository variable
          # Value: the URL of the mensa page that contains window.mensaData
          # e.g. https://www.stw-ma.de/Essen+_Trinken-p-7.html
          MENSA_URL: ${{ vars.MENSA_URL }}
        run: python scraper.py

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu.json
          git diff --staged --quiet \
            && echo "No changes to commit." \
            || git commit -m "chore: update mensa menu [skip ci]"
          git push
