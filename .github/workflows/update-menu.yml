name: Update Mensa Menu

on:
  # Run every Monday at 06:30 UTC.
  schedule:
    - cron: '30 6 * * 1'
  # Allow manual trigger from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        env:
          # Set this variable in Settings → Variables → Actions → New repository variable
          # Value: the URL of the mensa page that contains window.mensaData
          # e.g. https://www.stw-ma.de/Essen+_Trinken-p-7.html
          MENSA_URL: ${{ vars.MENSA_URL }}
        run: python scraper.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu.json
          git diff --staged --quiet \
            && echo "No changes to commit." \
            || git commit -m "chore: update mensa menu [skip ci]"
          git push
